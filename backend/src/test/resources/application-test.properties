# ============================================================
# SpendSum — Test Profile Properties
# Datasource is OVERRIDDEN at runtime by @DynamicPropertySource
# in TestcontainersConfig — these values are safe placeholders.
# ============================================================
spring.datasource.url=jdbc:tc:mysql:8.0:///spendsum_test?TC_REUSABLE=true
spring.datasource.username=test
spring.datasource.password=test
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver

# Create/drop schema automatically for each test run
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Disable async so agent processing runs synchronously in tests
spring.task.execution.pool.core-size=1
spring.task.execution.pool.max-size=1

# Suppress noisy Gemini API key — overridden by mocks in tests
gemini.api.key=test-key-placeholder
gemini.api.url=https://test-placeholder.invalid/

# Disable scheduler during tests
spring.task.scheduling.pool.size=0
